<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 500px;
        text-align: center;
      }

      .error-code {
        font-size: 6em;
        font-weight: bold;
        color: #667eea;
        line-height: 1;
        margin-bottom: 10px;
      }

      h1 {
        color: #333;
        margin-bottom: 15px;
        font-size: 1.5em;
      }

      p {
        color: #666;
        margin-bottom: 25px;
        line-height: 1.6;
      }

      .info {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 8px;
        text-align: left;
        color: #333;
      }

      a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The file or path you requested does not exist on this server.</p>

      <div class="info">
        <p>
          📖 For a list of available endpoints, see the
          <a href="https://github.com/USERNAME/REPO/blob/main/README.md" target="_blank"
            >README.md</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
